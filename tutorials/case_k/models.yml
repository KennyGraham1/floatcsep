# Generated by prepare.py: every model on every grid, named <MODEL>=<GRID>.
# Rates are expected M7.45+ events per year (forecast_unit: 1). PPE, EEPASfull and
# SUP are time-dependent: a folder with one forecast per time window.
# Quadtree grid N10L11
- GEAR1=N10L11:
    path: models/GEAR1=N10L11.csv
    forecast_unit: 1
    description: "Log-linear hybrid of smoothed seismicity and geodetic strain; the benchmark. Published GEFE forecast, time-independent"
- KJSS=N10L11:
    path: models/KJSS=N10L11.csv
    forecast_unit: 1
    description: "Kagan-Jackson smoothed seismicity. Published GEFE forecast, time-independent"
- SHIFT2F_GSRM=N10L11:
    path: models/SHIFT2F_GSRM=N10L11.csv
    forecast_unit: 1
    description: "Seismicity from the GSRM 2.1 strain rates. Published GEFE forecast, time-independent"
- TEAM=N10L11:
    path: models/TEAM=N10L11.csv
    forecast_unit: 1
    description: "Tectonic model: SMERF2 combined with a scaled SHIFT2F_GSRM. Published GEFE forecast, time-independent"
- WHEEL=N10L11:
    path: models/WHEEL=N10L11.csv
    forecast_unit: 1
    description: "Log-linear hybrid of KJSS and TEAM. Published GEFE forecast, time-independent"
- EEPASfull=N10L11:
    path: models/EEPASfull=N10L11
    class: td
    forecast_type: gridded
    description: "Every Earthquake a Precursor According to Scale, mixed with PPE. Refitted with the M>=5.45 PPE as its background (mu 0.41); reissued every year, with the same parameters, in the annual windows"
- PPE=N10L11:
    path: models/PPE=N10L11
    class: td
    forecast_type: gridded
    description: "Proximity to Past Earthquakes. Smoothed over M>=5.45 sources since 1918 (ISC-GEM and gCMT), fitted 1994-2013; reissued every year, with the same parameters, in the annual windows"
- SUP=N10L11:
    path: models/SUP=N10L11
    class: td
    forecast_type: gridded
    description: "Spatially uniform Poisson baseline. Fitted before 2014; one rate for every year"
- GSSGSRM=N10L11:
    path: models/GSSGSRM=N10L11.csv
    forecast_unit: 1
    description: "The SUP baseline modulated by the GSRM strain-rate alarm. Fitted before 2014, time-independent"
